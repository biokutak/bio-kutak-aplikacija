name: Build BIO KUTAK Prize Box APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'bio-kutak-prizebox/**'
      - '.github/workflows/build-bio-kutak-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bio-kutak-prizebox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bio-kutak-15-godina-apk
          path: bio-kutak-prizebox/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
