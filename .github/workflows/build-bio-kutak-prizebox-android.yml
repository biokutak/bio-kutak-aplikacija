name: Build BIO KUTAK 15 godina Box and Phone APKs
on:
  push:
    paths:
      - 'bio-kutak-prizebox-android/**'
      - 'bio-kutak-remote-android/**'
      - '.github/workflows/build-bio-kutak-prizebox-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Box APK with local Wi-Fi remote server
        run: gradle --no-daemon --stacktrace -p bio-kutak-prizebox-android :app:assembleDebug
      - name: Build Phone Remote APK
        run: gradle --no-daemon --stacktrace -p bio-kutak-remote-android :app:assembleDebug
      - name: Prepare and verify APKs
        run: |
          mkdir -p output
          cp bio-kutak-prizebox-android/app/build/outputs/apk/debug/app-debug.apk output/BIO-KUTAK-15-GODINA-BOX.apk
          cp bio-kutak-remote-android/app/build/outputs/apk/debug/app-debug.apk output/BIO-KUTAK-15-GODINA-TELEFON.apk
          test -s output/BIO-KUTAK-15-GODINA-BOX.apk
          test -s output/BIO-KUTAK-15-GODINA-TELEFON.apk
          unzip -t output/BIO-KUTAK-15-GODINA-BOX.apk
          unzip -t output/BIO-KUTAK-15-GODINA-TELEFON.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BIO-KUTAK-15-GODINA-BOX-I-TELEFON
          path: output/*.apk
          if-no-files-found: error
