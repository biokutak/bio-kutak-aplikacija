name: Build BIO KUTAK 15 godina APK
on:
  push:
    paths:
      - 'bio-kutak-prizebox-android/**'
      - '.github/workflows/build-bio-kutak-prizebox-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build installable Android APK
        run: gradle --no-daemon --stacktrace -p bio-kutak-prizebox-android :app:assembleDebug
      - name: Verify APK exists
        run: test -s bio-kutak-prizebox-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BIO-KUTAK-15-GODINA-APK
          path: bio-kutak-prizebox-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
